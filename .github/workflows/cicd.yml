name: Build and deploy dotexe.dev

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.28.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Install frontend dependencies
        run: pnpm --dir src/app install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir src/app build

      - name: Publish Functions API
        run: >-
          dotnet publish src/api/Dotexe.Api/Dotexe.Api.csproj
          --configuration Release --runtime win-x64 --self-contained false
          --output artifacts/api

      # No GitHub Actions storage is used: no dependency cache and no
      # artifacts. The build and the deploy run in this one job, so the
      # built frontend and API are handed straight to the Azure deploy
      # step instead of being uploaded and downloaded as artifacts.
      - name: Deploy to Azure Static Web Apps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "src/app/dist"
          api_location: "artifacts/api"
          output_location: ""
          skip_app_build: true
          skip_api_build: true
