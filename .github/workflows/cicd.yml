name: Build and deploy dotexe.dev

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.28.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/app/pnpm-lock.yaml

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Install frontend dependencies
        run: pnpm --dir src/app install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir src/app build

      - name: Publish Functions API
        run: >-
          dotnet publish src/api/Dotexe.Api/Dotexe.Api.csproj
          --configuration Release --runtime linux-x64 --self-contained false
          --output artifacts/api

      - uses: actions/upload-artifact@v4
        with:
          name: dotexe-web
          path: src/app/dist
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: dotexe-api-linux-x64
          path: artifacts/api
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dotexe-web
          path: app

      - uses: actions/download-artifact@v4
        with:
          name: dotexe-api-linux-x64
          path: api

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "app"
          api_location: "api"
          output_location: ""
          skip_app_build: true
          skip_api_build: true
